<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mochi英文">
<meta name="theme-color" content="#F4F1FA">
<title>Mochi English</title>
<style>
/* Layout: phone-first app shell — top bar / scrolling view / (chat composer) / bottom tab bar. */
:root {
  --bg: #F4F1FA; --surface: #FFFFFF; --surface-2: #ECE7F6; --ink: #1F1A2E; --muted: #625B74; --line: #DCD5EA;
  --accent: #6B4FD8; --accent-ink: #FFFFFF; --accent-soft: #E6DFFB;
  --me: #DDEBFF; --red: #C23A2B; --red-soft: #FBE3DF; --green: #23774A; --green-soft: #DCF2E4; --amber-soft: #FFF2CF;
  --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Hiragino Sans", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15121D; --surface: #1F1A2A; --surface-2: #2A2438; --ink: #EEEAF6; --muted: #A9A1BC; --line: #3A3249;
    --accent: #A08CFF; --accent-ink: #15121D; --accent-soft: #332A52;
    --me: #23344D; --red: #FF9C8C; --red-soft: #45241F; --green: #86D9A6; --green-soft: #1B3527; --amber-soft: #3A321B;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100dvh; display: grid; grid-template-rows: auto 1fr auto auto; max-width: 680px; margin: 0 auto; }
.topbar { padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); display: flex; align-items: center; gap: 10px; background: var(--bg); }
.topbar h1 { font-size: 20px; margin: 0; margin-right: auto; letter-spacing: -.01em; }
.badge { font-size: 15px; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; white-space: nowrap; }
.view { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); }
.stack { display: flex; flex-direction: column; gap: 14px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card h2 { font-size: 18px; margin: 0; }
.card h3 { font-size: 16px; margin: 0; color: var(--muted); }
.muted { color: var(--muted); font-size: 16px; }
.small { font-size: 15px; color: var(--muted); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 16px; font-size: 17px; font-weight: 600; min-height: 46px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn.danger { color: var(--red); }
.btn:disabled { opacity: .5; }
input[type="text"], input[type="password"], select, textarea { font-size: 17px; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; width: 100%; }
label.chk { display: flex; align-items: center; gap: 10px; font-size: 17px; }
label.chk input { width: 22px; height: 22px; accent-color: var(--accent); }

/* Avatar */
.avatar { width: 84px; height: 84px; flex: none; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; overflow: hidden; }
.avatar.sm { width: 52px; height: 52px; }
.avatar svg { width: 92%; height: 92%; }
.avatar .e-happy, .avatar .e-think { display: none; }
.avatar[data-mood="happy"] .e-normal, .avatar[data-mood="thinking"] .e-normal { display: none; }
.avatar[data-mood="happy"] .e-happy { display: inline; }
.avatar[data-mood="thinking"] .e-think { display: inline; }
.avatar .m-open { opacity: 0; }
.talking .avatar .m-open { animation: talkO .32s steps(1) infinite; }
.talking .avatar .m-closed { animation: talkC .32s steps(1) infinite; }
@keyframes talkO { 0% { opacity: 1 } 50% { opacity: 0 } }
@keyframes talkC { 0% { opacity: 0 } 50% { opacity: 1 } }

.stage { display: flex; gap: 12px; align-items: center; padding: 6px 0 10px; }
.stage .say { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; font-size: 16px; position: relative; }
.stage .name { font-weight: 700; font-size: 16px; }

/* Lesson */
.phrase { font-size: 21px; font-weight: 700; color: var(--accent); }
.words { display: grid; gap: 10px; }
.word { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; background: var(--surface-2); border-radius: 14px; padding: 10px; }
.word .emo { font-size: 38px; line-height: 1; text-align: center; }
.word .w { font-weight: 700; font-size: 18px; }
.word .ex { font-size: 15px; color: var(--muted); }

.spk { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; padding: 0; color: var(--accent); }
.spk svg { width: 20px; height: 20px; }

/* Chat */
.msgs { display: flex; flex-direction: column; gap: 12px; padding-bottom: 8px; }
.msg { display: flex; gap: 8px; max-width: 94%; align-items: flex-end; }
.msg.ai { align-self: flex-start; }
.msg.me { align-self: flex-end; flex-direction: column; align-items: flex-end; }
.bubble { padding: 10px 12px; border-radius: 16px; font-size: 17px; overflow-wrap: anywhere; display: flex; gap: 8px; align-items: flex-start; }
.ai .bubble { background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; flex-direction: column; align-items: stretch; }
.me .bubble { background: var(--me); border-bottom-right-radius: 4px; }
.ai .bubble .line1 { display: flex; gap: 8px; align-items: flex-start; }
.ai .bubble .line1 .t { flex: 1; min-width: 0; }
details.zh { font-size: 15px; color: var(--muted); }
details.zh summary { cursor: pointer; }
.fb { width: 100%; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--red); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 16px; }
.fb.ok { border-left-color: var(--green); background: var(--green-soft); }
.fb .lbl { font-size: 15px; font-weight: 700; color: var(--muted); }
.fb .ln { display: flex; gap: 8px; align-items: flex-start; }
.fb .ln .t { flex: 1; min-width: 0; font-size: 17px; overflow-wrap: anywhere; }
.del { color: var(--red); text-decoration: line-through; text-decoration-thickness: 2px; }
.ins { color: var(--green); font-weight: 700; background: var(--green-soft); border-radius: 4px; padding: 0 3px; }
.chip { display: inline-block; font-size: 15px; padding: 1px 10px; border-radius: 999px; background: var(--red-soft); color: var(--red); width: fit-content; }
.newword { background: var(--amber-soft); border-radius: 14px; padding: 10px 12px; display: grid; grid-template-columns: 44px 1fr auto; gap: 8px; align-items: center; font-size: 16px; }
.newword .emo { font-size: 32px; text-align: center; }
.typing { color: var(--muted); font-size: 16px; }
.typing::after { content: "…"; animation: blink 1.2s steps(4) infinite; }
@keyframes blink { 0% { opacity: .2 } 50% { opacity: 1 } 100% { opacity: .2 } }

.composer { padding: 8px max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left)); background: var(--surface); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.composer .inrow { display: flex; gap: 8px; align-items: flex-end; }
.mic { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.mic svg { width: 24px; height: 24px; }
.mic.on { background: var(--red); color: #fff; }
.composer textarea { height: 52px; resize: none; line-height: 1.4; }
.composer .send { flex: none; height: 52px; }
.composer .tools { display: flex; gap: 8px; flex-wrap: wrap; }
.composer .tools .btn { min-height: 38px; padding: 4px 12px; font-size: 16px; font-weight: 500; }
.hints { display: flex; flex-direction: column; gap: 6px; }
.hint { display: flex; gap: 8px; align-items: center; background: var(--surface-2); border-radius: 12px; padding: 6px 10px; font-size: 16px; }
.hint .t { flex: 1; min-width: 0; }
.hint .t small { display: block; color: var(--muted); font-size: 15px; }

.tabbar { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar button { border: 0; background: none; padding: 8px 0 6px; font-size: 15px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
.tabbar button .i { font-size: 22px; line-height: 1; }
.tabbar button[aria-current="page"] { color: var(--accent); font-weight: 700; }
.tabbar .dot { position: absolute; top: 4px; left: calc(50% + 8px); min-width: 20px; height: 20px; border-radius: 10px; background: var(--red); color: #fff; font-size: 13px; line-height: 20px; padding: 0 5px; }

/* Review */
.flash { min-height: 220px; justify-content: center; text-align: center; }
.flash .big { font-size: 56px; line-height: 1.1; }
.flash .front { font-size: 22px; font-weight: 700; }
.grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

/* Log */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 14px; padding: 10px; text-align: center; }
.stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
.sess { border-top: 1px solid var(--line); padding-top: 10px; }
.sess summary { cursor: pointer; font-size: 16px; }
.sess .turn { font-size: 15px; padding: 4px 0; border-bottom: 1px dashed var(--line); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 16px; z-index: 50; max-width: calc(100% - 32px); }
.avpick { display: flex; gap: 12px; }
.avpick button { border: 2px solid var(--line); background: var(--surface); border-radius: 18px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 16px; }
.avpick button[aria-pressed="true"] { border-color: var(--accent); }
ol.steps { margin: 0; padding-left: 22px; font-size: 16px; display: flex; flex-direction: column; gap: 6px; }
@media (prefers-reduced-motion: reduce) { .talking .avatar .m-open, .talking .avatar .m-closed, .typing::after { animation: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="avatar sm" id="top-av"></div>
    <h1 id="top-title">Mochi 英文教室</h1>
    <span class="badge" id="lv-badge" hidden></span>
  </header>
  <main class="view" id="view"></main>
  <div class="composer" id="composer" hidden>
    <div class="hints" id="hints" hidden></div>
    <div class="inrow">
      <button type="button" class="mic" id="mic" aria-label="開始說英文">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v5"/></svg>
      </button>
      <textarea id="input" rows="1" placeholder="說英文或打字"></textarea>
      <button type="button" class="btn primary send" id="send">送出</button>
    </div>
    <div class="tools">
      <button type="button" class="btn" id="hint-btn">給我提示</button>
      <button type="button" class="btn" id="stop-say">停止朗讀</button>
      <button type="button" class="btn" id="end-btn">結束練習</button>
    </div>
  </div>
  <nav class="tabbar" id="tabbar">
    <button type="button" data-v="today"><span class="i">📖</span>今日</button>
    <button type="button" data-v="chat"><span class="i">💬</span>對話</button>
    <button type="button" data-v="review"><span class="i">🔁</span>複習<span class="dot" id="due-dot" hidden></span></button>
    <button type="button" data-v="log"><span class="i">📒</span>紀錄</button>
    <button type="button" data-v="settings"><span class="i">⚙️</span>設定</button>
  </nav>
</div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script>
(() => {
"use strict";

/* ================= Storage ================= */
const LS = {
  get(k, d) { try { const v = localStorage.getItem("me." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("me." + k, JSON.stringify(v)); return true; } catch { toast("手機的儲存空間不足，請到「設定」備份後刪除舊紀錄。"); return false; } }
};
const DEF_SETTINGS = { apiKey: "", model: "", avatar: "cat", rate: 0.9, voice: "", autoSpeak: true, autoSend: true, ttsEngine: "gemini", gVoice: "Kore", ttsModel: "", speakReason: true, handsFree: true, pauseSec: 3 };
let settings = Object.assign({}, DEF_SETTINGS, LS.get("settings", {}));
let profile = Object.assign({ level: "", levelZh: "", weak: [], strengths: [], note: "", nextFocus: "", stage: "travel", topicIdx: 0, day: 1, tbDay: 1, levelHistory: [], placementDone: false, practiceDays: [] }, LS.get("profile", {}));
let sessions = LS.get("sessions", []);
let cards = LS.get("cards", []);
let lesson = LS.get("lesson", null);
let textbook = LS.get("textbook", "");
let current = LS.get("current", null);
let tbook = LS.get("tbook", null); // the learner's own textbook data, imported from a private file on the phone
const saveAll = () => { LS.set("tbook", tbook); LS.set("settings", settings); LS.set("profile", profile); LS.set("sessions", sessions); LS.set("cards", cards); LS.set("lesson", lesson); LS.set("textbook", textbook); LS.set("current", current); };

/* ================= Data ================= */
const STAGES = {
  travel: { name: "旅行篇", topics: ["機場報到", "飛機上", "入境審查", "飯店入住", "問路", "搭計程車・電車", "餐廳點餐", "咖啡廳", "購物・退換貨", "旅途中的小麻煩"] },
  daily: { name: "日常閒聊篇", topics: ["自我介紹", "週末做了什麼", "興趣嗜好", "天氣與季節", "喜歡的食物", "家人與朋友", "電影與音樂", "健康與運動", "假期計畫", "最近的新聞"] },
  business: { name: "商務篇", topics: ["跟同事寒暄", "會議中報告進度", "跟供應商確認交期", "請對方寄樣品", "漲價交涉", "品質問題的溝通", "電話應對", "線上會議的開場與結尾", "請求與拒絕", "感謝與道歉"] }
};
const STAGE_ORDER = ["travel", "daily", "business"];
const PLACEMENT_Q = [
  { en: "Hi! I'm happy to meet you. Could you tell me a little about yourself?", zh: "嗨！很高興認識你。可以簡單介紹一下自己嗎？" },
  { en: "What did you do last weekend?", zh: "你上個週末做了什麼？" },
  { en: "What kind of work do you do?", zh: "你做什麼樣的工作？" },
  { en: "If you could travel anywhere, where would you go, and why?", zh: "如果可以去任何地方旅行，你想去哪裡？為什麼？" },
  { en: "Last question! What would you like to be able to do in English?", zh: "最後一題！你希望用英文做到什麼事？" }
];
const CATEGORIES = ["時態", "冠詞", "介系詞", "單複數", "主詞動詞一致", "用字", "語序", "句型", "說法不自然", "禮貌・語氣", "中文轉英文", "其他"];
const INTERVALS = [1, 3, 7, 14, 30, 60];
const AV = { cat: { name: "Mochi", who: "貓咪老師" }, person: { name: "Alex", who: "人像老師" } };

/* ================= Helpers ================= */
const $ = (id) => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const addDays = (n) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + n); return d.getTime(); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const hasCJK = (s) => /[぀-ヿ㐀-鿿]/.test(s);
let toastTimer;
function toast(msg) {
  document.querySelectorAll(".toast").forEach(e => e.remove());
  const t = h("div", { class: "toast", role: "status" }, msg); document.body.append(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3800);
}
const dueCards = () => { const now = Date.now(); return cards.filter(c => c.due <= now); };

/* ================= Avatar ================= */
function avatarSVG(kind) {
  const mouth = '<path class="m-closed" d="M52 79 Q56 84 60 79 Q64 84 68 79" fill="none" stroke="#3B2A2A" stroke-width="2.6" stroke-linecap="round"/><ellipse class="m-open" cx="60" cy="81" rx="6" ry="5.5" fill="#8E3B3B"/>';
  if (kind === "person") return '<svg viewBox="0 0 120 120" aria-hidden="true">' +
    '<path d="M22 120 Q24 96 60 94 Q96 96 98 120Z" fill="#5E7BD6"/><path d="M50 94 L60 106 L70 94Z" fill="#fff"/>' +
    '<rect x="52" y="80" width="16" height="16" rx="6" fill="#E9B894"/>' +
    '<ellipse cx="60" cy="58" rx="30" ry="33" fill="#F2C7A5"/>' +
    '<path d="M29 56 Q26 22 60 22 Q96 22 91 56 Q88 40 74 36 Q60 44 40 38 Q32 44 29 56Z" fill="#3A2C2A"/>' +
    '<g class="e-normal"><ellipse cx="48" cy="60" rx="3.6" ry="4.6" fill="#2A1F1F"/><ellipse cx="72" cy="60" rx="3.6" ry="4.6" fill="#2A1F1F"/></g>' +
    '<g class="e-happy" fill="none" stroke="#2A1F1F" stroke-width="2.6" stroke-linecap="round"><path d="M43 61 Q48 55 53 61"/><path d="M67 61 Q72 55 77 61"/></g>' +
    '<g class="e-think"><ellipse cx="50" cy="57" rx="3.6" ry="4.6" fill="#2A1F1F"/><ellipse cx="74" cy="57" rx="3.6" ry="4.6" fill="#2A1F1F"/></g>' +
    '<path d="M42 50 Q48 47 54 50 M66 50 Q72 47 78 50" stroke="#3A2C2A" stroke-width="2.4" fill="none" stroke-linecap="round"/>' +
    '<ellipse cx="40" cy="70" rx="5" ry="3" fill="#F09A8A" opacity=".55"/><ellipse cx="80" cy="70" rx="5" ry="3" fill="#F09A8A" opacity=".55"/>' +
    mouth + '</svg>';
  return '<svg viewBox="0 0 120 120" aria-hidden="true">' +
    '<path d="M20 54 L26 14 L52 36Z" fill="#F7F3EE" stroke="#4A3F3A" stroke-width="3" stroke-linejoin="round"/>' +
    '<path d="M100 54 L94 14 L68 36Z" fill="#F7F3EE" stroke="#4A3F3A" stroke-width="3" stroke-linejoin="round"/>' +
    '<path d="M29 42 L30 25 L44 36Z" fill="#F6B8C4"/><path d="M91 42 L90 25 L76 36Z" fill="#F6B8C4"/>' +
    '<ellipse cx="60" cy="68" rx="45" ry="38" fill="#F7F3EE" stroke="#4A3F3A" stroke-width="3"/>' +
    '<path d="M74 34 Q86 38 92 50 Q82 46 72 46Z" fill="#E8A65B" opacity=".9"/>' +
    '<g class="e-normal"><ellipse cx="44" cy="64" rx="5" ry="7" fill="#2B2320"/><ellipse cx="76" cy="64" rx="5" ry="7" fill="#2B2320"/><circle cx="45.8" cy="61" r="1.9" fill="#fff"/><circle cx="77.8" cy="61" r="1.9" fill="#fff"/></g>' +
    '<g class="e-happy" fill="none" stroke="#2B2320" stroke-width="3" stroke-linecap="round"><path d="M38 66 Q44 57 50 66"/><path d="M70 66 Q76 57 82 66"/></g>' +
    '<g class="e-think"><ellipse cx="47" cy="60" rx="5" ry="6.5" fill="#2B2320"/><ellipse cx="79" cy="60" rx="5" ry="6.5" fill="#2B2320"/><circle cx="48.6" cy="57.6" r="1.8" fill="#fff"/><circle cx="80.6" cy="57.6" r="1.8" fill="#fff"/></g>' +

$("import-file").addEventListener("change", async (e) => {
  const f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.app !== "mochi-english") throw 0;
    const key = settings.apiKey, model = settings.model;
    settings = Object.assign({}, DEF_SETTINGS, d.settings || {}, { apiKey: key, model });
    profile = Object.assign(profile, d.profile || {}); sessions = d.sessions || []; cards = d.cards || []; lesson = d.lesson || null; textbook = d.textbook || ""; tbook = d.tbook || tbook;
    saveAll(); toast("還原完成！"); go("today");
  } catch { toast("這個檔案不是 Mochi 英文教室的備份。"); }
